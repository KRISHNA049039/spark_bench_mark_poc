# ===========================================================================
# WORKER NODE — Optimized for 32 GB RAM + 8 GB VRAM
#
# Deploy on each worker machine (you have 2 workers).
#
# Memory Layout:
#   32 GB Total RAM
#   ├── 3 GB  → OS + Docker
#   ├── 1 GB  → Spark Worker daemon
#   ├── 14 GB → Executor 1 (12 GB heap + 2 GB overhead) — CPU tasks
#   ├── 12 GB → Executor 2 (10 GB heap + 2 GB overhead) — GPU tasks
#   └── 2 GB  → Buffer (Python workers, model deserialization)
#
# GPU Layout:
#   8 GB VRAM
#   ├── ~300 MB → Model weights (largest: DistilBERT 254 MB)
#   ├── ~500 MB → Activations per batch (batch_size=64)
#   ├── ~200 MB → CUDA context + overhead
#   └── ~7 GB  → Available for larger batches / multiple models
#
# Usage:
#   On worker machine:
#   docker compose -f docker-compose.worker-optimized.yml build
#   docker compose -f docker-compose.worker-optimized.yml up
# ===========================================================================

services:
  spark-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: spark-worker-opt
    ports:
      - "8081:8081"
      - "7078:7078"
      - "35000-35100:35000-35100"
    command:
      - bash
      - -c
      - |
        CORES=$(nproc)
        echo '========================================'
        echo "Spark Worker starting with $CORES cores..."
        echo "Advertising as: ${SPARK_LOCAL_HOSTNAME}"
        echo "Connecting to master: 192.168.4.100:7077"
        echo "Memory: 28g, Cores: $CORES"
        echo '========================================'
        /opt/spark/sbin/start-worker.sh spark://192.168.4.100:7077 \
          -m 28g \
          -c $CORES \
          --webui-port 8081 \
          --port 7078 &&
        echo 'Worker connected!' &&
        tail -f /opt/spark/logs/*
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_WORKER_MEMORY=28g
      # SET THIS TO THE WORKER MACHINE'S ACTUAL LAN IP (from ipconfig)
      - SPARK_LOCAL_HOSTNAME=192.168.4.101
      - SPARK_WORKER_PORT=7078
      - SPARK_WORKER_OPTS=-Dspark.executor.port=35000
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        limits:
          memory: 30g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
