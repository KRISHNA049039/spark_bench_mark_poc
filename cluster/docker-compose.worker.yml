# ===========================================================================
# NODE 2 (or 3, 4...): Spark Worker
#
# Deploy this on each worker machine.
# 1. Build:  docker compose -f docker-compose.worker.yml build
# 2. Start:
#    Windows:  set MASTER_IP=192.168.x.x && docker compose -f docker-compose.worker.yml up
#    Linux:    MASTER_IP=192.168.x.x docker compose -f docker-compose.worker.yml up
#
# Replace 192.168.x.x with the IP address of the master node.
# ===========================================================================

services:
  spark-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: spark-worker
    network_mode: host
    command: >
      bash -c "
        echo 'Connecting to master at spark://192.168.4.100:7077...' &&
        /opt/spark/sbin/start-worker.sh spark://192.168.4.100:7077 \
          -m $${SPARK_WORKER_MEMORY} \
          -c $${SPARK_WORKER_CORES} \
          --webui-port 8081 &&
        echo 'Worker connected!' &&
        tail -f /opt/spark/logs/*
      "
    environment:
      - MASTER_IP=192.168.4.100
      - SPARK_NO_DAEMONIZE=1
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_CORES=4
      - SPARK_LOCAL_HOSTNAME=${WORKER_IP:-0.0.0.0}
