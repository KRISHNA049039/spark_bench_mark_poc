# ===========================================================================
# NODE 1: Spark Master + Driver
#
# Deploy this on your first machine.
# 1. Build:  docker compose -f docker-compose.master.yml build
# 2. Start:  docker compose -f docker-compose.master.yml up
#
# After Node 2 workers connect, the driver auto-submits the benchmark.
# ===========================================================================

services:
  spark-master:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"     # Spark Web UI
      - "7077:7077"     # Spark master port (workers connect here)
      - "4040:4040"     # Spark application UI
    command: >
      bash -c "
        echo 'Starting Spark Master...' &&
        /opt/spark/sbin/start-master.sh --host 0.0.0.0 --port 7077 --webui-port 8080 &&
        echo 'Master started on port 7077' &&
        tail -f /opt/spark/logs/*
      "
    environment:
      - SPARK_NO_DAEMONIZE=1
      - SPARK_MASTER_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - spark-net

  # Driver — waits for workers, then runs benchmark
  benchmark-driver:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: benchmark-driver
    volumes:
      - ../benchmark_results:/app/benchmark_results
    environment:
      # Point to the master
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=4g
      - SPARK_EXECUTOR_CORES=2
      - SPARK_NUM_EXECUTORS=2
      - BENCHMARK_OUTPUT_DIR=/app/benchmark_results
    entrypoint: >
      bash -c "
        echo 'Waiting 15s for workers to connect...' &&
        sleep 15 &&
        echo 'Starting benchmark...' &&
        python -m pytorch_benchmark.run_inference_only --all --no-gpu --samples 200
      "
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 4g
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
